<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TheBigDutz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script async src="https://www.tiktok.com/embed.js"></script>
</head>

<body class="bg-black text-white">

<nav class="fixed top-0 w-full bg-black/70 border-b border-white/10 p-4 flex gap-6">
  <button onclick="show('home')">Home</button>
  <button onclick="show('clips')">Clips</button>
  <button onclick="show('gifters')">Gifters</button>
  <button onclick="show('staff')">Staff</button>
</nav>

<div class="pt-20 px-6">

<section id="home" class="section">
  <h1 class="text-5xl font-bold">THE<span class="text-indigo-500">BIG</span>DUTZ</h1>
</section>

<section id="clips" class="section hidden">
  <h2 class="text-3xl my-6">Clips</h2>
  <div id="clipsGrid" class="grid md:grid-cols-3 gap-6"></div>
</section>

<section id="gifters" class="section hidden">
  <h2 class="text-3xl my-6">Gifters</h2>
  <div id="giftersGrid" class="grid md:grid-cols-3 gap-6"></div>
</section>

<section id="staff" class="section hidden">
  <h2 class="text-3xl my-6">Staff</h2>
  <a href="/auth/discord" class="bg-indigo-600 px-6 py-3 rounded">Login with Discord</a>
</section>

</div>

<script>
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

fetch('/clips').then(r=>r.json()).then(d=>{
  d.clips.forEach(u=>{
    clipsGrid.innerHTML+=`<blockquote class="tiktok-embed"><a href="${u}"></a></blockquote>`;
  });
  d.gifters.forEach(u=>{
    giftersGrid.innerHTML+=`<blockquote class="tiktok-embed"><a href="${u}"></a></blockquote>`;
  });
  setTimeout(()=>window.tiktokEmbed?.load(),500);
});
</script>

</body>
</html>
