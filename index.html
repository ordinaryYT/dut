<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TheBigDutz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script async src="https://www.tiktok.com/embed.js"></script>
</head>

<body class="bg-gradient-to-br from-zinc-950 via-zinc-900 to-black text-white">

<nav class="fixed top-0 w-full backdrop-blur bg-black/40 border-b border-white/10 z-50">
  <div class="max-w-7xl mx-auto flex justify-between px-6 py-4">
    <span class="font-bold text-xl">TheBigDutz</span>
    <div class="flex gap-6 text-sm text-zinc-300">
      <button onclick="show('home')">Home</button>
      <button onclick="show('clips')">Clips</button>
      <button onclick="show('gifters')">Gifters</button>
      <button onclick="show('staff')">Staff</button>
    </div>
  </div>
</nav>

<div class="pt-28">

<section id="home" class="section min-h-[80vh] flex items-center px-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-6xl font-extrabold">
      THE<span class="text-indigo-500">BIG</span>DUTZ
    </h1>
    <p class="text-zinc-400 mt-6">Fortnite • TikTok • Live Streaming</p>
  </div>
</section>

<section id="clips" class="section hidden px-6 py-20">
  <h2 class="text-4xl font-bold mb-10">🔥 Best Fortnite Clips</h2>
  <div id="clipsGrid" class="grid md:grid-cols-3 gap-8"></div>
</section>

<section id="gifters" class="section hidden px-6 py-20">
  <h2 class="text-4xl font-bold mb-10">🏆 Top Gifter Clips</h2>
  <div id="giftersGrid" class="grid md:grid-cols-3 gap-8"></div>
</section>

<section id="staff" class="section hidden px-6 py-20 text-center">
  <h2 class="text-4xl font-bold mb-6">Apply for Staff</h2>
  <a href="/auth/discord"
     class="bg-indigo-600 px-8 py-4 rounded-xl inline-block">
    Login with Discord
  </a>
</section>

</div>

<script>
function show(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

fetch('/clips')
  .then(r => r.json())
  .then(d => {
    d.clips.forEach(u => {
      clipsGrid.innerHTML += `<blockquote class="tiktok-embed"><a href="${u}"></a></blockquote>`;
    });
    d.gifters.forEach(u => {
      giftersGrid.innerHTML += `<blockquote class="tiktok-embed"><a href="${u}"></a></blockquote>`;
    });
    setTimeout(() => window.tiktokEmbed?.load(), 500);
  });
</script>

</body>
</html>
